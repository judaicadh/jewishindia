<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feature · Jewish India Digital Heritage Trail</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark peacock-mark" aria-hidden="true"></span>
      <span class="brand-text">
        <span class="brand-name">Jewish India</span>
        <span class="brand-tag">Digital Heritage Trail</span>
      </span>
    </a>
    <nav class="site-nav">
      <a href="index.html" data-nav="home">Home</a>
      <a href="map.html" data-nav="map">Map</a>
      <a href="synagogues.html" data-nav="synagogues">Synagogues</a>
      <a href="cemeteries.html" data-nav="cemeteries">Cemeteries</a>
      <a href="mills.html" data-nav="mills">Sassoon Mills</a>
      <a href="about.html" data-nav="about">About</a>
    </nav>
    <div class="site-search">
      <input type="search" id="site-search" placeholder="Search sites…" autocomplete="off">
      <div class="site-search-results" id="site-search-results"></div>
    </div>
    <div class="site-header-utils">
      <button id="theme-toggle" class="icon-btn" type="button" aria-pressed="false" title="Toggle dark mode"></button>
      <button id="menu-btn" class="icon-btn menu-btn" type="button" aria-expanded="false" aria-controls="site-nav" title="Menu"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>
    </div>
  </div>
</header>

<main class="feature-page" id="feature-content">
  <p>Loading…</p>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <span class="footer-mark peacock-mark" aria-hidden="true"></span>
    <p>Jewish India Digital Heritage Trail</p>
  </div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data/features.js"></script>
<script src="assets/site.js"></script>
<script>
(async function() {
  const id = new URLSearchParams(location.search).get('id');
  const features = await loadFeatures();
  const f = features.find(x => x.id === id);
  const root = document.getElementById('feature-content');
  if (!f) {
    root.innerHTML = `<h1>Not found</h1><p>No feature with id <code>${id}</code>. <a href="map.html">Back to map</a>.</p>`;
    return;
  }
  document.title = `${f.name} · Jewish India Digital Heritage Trail`;
  const meta = [
    categoryLabel(f),
    eraText(f),
    f.city || f.region,
    f.coords_approximate ? '· coords approximate' : ''
  ].filter(Boolean).join(' · ');
  const galleryHtml = (f.images && f.images.length)
    ? `<div class="gallery-large">` +
        f.images.map(img => `<img src="${imageUrl(f, img)}" alt="${f.name}" loading="lazy" onclick="openLightbox(this.src)">`).join("") +
      `</div>`
    : `<div class="empty-state">
         <div class="empty-peacock peacock-mark" aria-hidden="true"></div>
         <p>No images yet for this site.</p>
       </div>`;
  const desc = f.description
    ? `<div class="feature-desc">${f.description}</div>`
    : `<div class="feature-desc-placeholder">Description not yet written. Edit <code>data/features.json</code> to add one.</div>`;
  const sources = f.sources && f.sources.length
    ? `<p class="feature-sources"><strong>Sources:</strong> ${f.sources.join('; ')}</p>` : '';

  // IIIF viewer — rendered only when a manifest URL is present
  const iiifHtml = f.iiif_manifest ? `
    <section class="iiif-section">
      <h2 class="iiif-heading">IIIF Collection</h2>
      <div class="iiif-embed">
        <iframe
          src="https://uv-v4.netlify.app/#?manifest=${encodeURIComponent(f.iiif_manifest)}"
          allowfullscreen
          title="IIIF viewer for ${f.name}">
        </iframe>
      </div>
      <p class="iiif-links">
        <a href="https://uv-v4.netlify.app/#?manifest=${encodeURIComponent(f.iiif_manifest)}" target="_blank" rel="noopener">Open in Universal Viewer ↗</a>
        &ensp;·&ensp;
        <a href="${f.iiif_manifest}" target="_blank" rel="noopener">View manifest JSON ↗</a>
      </p>
    </section>` : '';

  root.innerHTML = `
    <p class="back-link"><a href="javascript:history.back()">← Back</a></p>
    <h1>${f.name}</h1>
    <div class="meta-line">${meta}</div>
    <div class="chips chips-row">${communityChips(f)}</div>
    ${desc}
    ${f.address ? `<p class="feature-address"><strong>Address:</strong> ${f.address}${f.state?', '+f.state:''}</p>` : ''}
    ${galleryHtml}
    ${iiifHtml}
    ${f.coords ? `<div id="mini-map" class="mini-map"></div>` : ''}
    ${sources}
  `;
  if (f.coords) {
    const m = L.map('mini-map', { center: f.coords, zoom: 14, scrollWheelZoom: false });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO', subdomains: 'abcd'
    }).addTo(m);
    L.marker(f.coords).addTo(m);
  }
})();
</script>
</body>
</html>
