name: Sync & Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Runs daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Sync data from Google Sheet
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
        run: |
          if [ -z "$SHEET_URL" ]; then
            echo "::error::SHEET_URL secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          python sync-from-sheet.py "$SHEET_URL"

      - name: Verify sync produced data
        run: |
          if [ ! -s data/features.json ]; then
            echo "::error::data/features.json is missing or empty after sync."
            exit 1
          fi
          COUNT=$(python -c "import json; print(len(json.load(open('data/features.json'))['features']))")
          echo "Synced $COUNT features."
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::Sync produced 0 features — check your sheet columns and the SHEET_URL secret."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
